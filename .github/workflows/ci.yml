name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  atlas-forge-invsqrt-build:
    name: Build and verify Atlas Forge invsqrt circuit
    if: github.event_name == 'pull_request' && github.head_ref == 'atlas-forge/invsqrt-artifact-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kickmix build prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "pybind11==2.12.0" setuptools wheel

      - name: Fetch exact pinned Kickmix source tree
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import time
          import urllib.request
          from pathlib import Path

          TREE = "638777fac4379bc62e2a1e4a52cf1a1753895d48"
          API = f"https://api.github.com/repos/quantumlib/Qualtran/git/trees/{TREE}?recursive=1"
          req = urllib.request.Request(API, headers={"User-Agent": "atlas-forge-invsqrt-builder"})
          with urllib.request.urlopen(req, timeout=120) as response:
              tree = json.load(response)
          entries = [item for item in tree["tree"]
                     if item["type"] == "blob" and item["path"].startswith("kickmix/")]
          if not entries or tree.get("truncated"):
              raise RuntimeError("Pinned Kickmix tree is empty or truncated")

          root = Path("/tmp/atlas-forge-kickmix")
          root.mkdir(parents=True, exist_ok=True)

          def fetch(item):
              rel = item["path"][len("kickmix/"):]
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              url = f"https://raw.githubusercontent.com/quantumlib/Qualtran/{TREE}/{item['path']}"
              last_error = None
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "atlas-forge-invsqrt-builder"})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()
                      git_blob = hashlib.sha1(
                          f"blob {len(data)}\\0".encode("ascii") + data
                      ).hexdigest()
                      if len(data) != item["size"] or git_blob != item["sha"]:
                          raise RuntimeError(f"pin mismatch for {item['path']}: bytes={len(data)}, blob={git_blob}")
                      target.write_bytes(data)
                      return len(data)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(1 + attempt)
              raise RuntimeError(f"could not fetch {item['path']}: {last_error}")

          total = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for size in pool.map(fetch, entries):
                  total += size
          print(f"Fetched and SHA-1-checked {len(entries)} Kickmix files ({total:,} bytes)")
          PY
          python -m pip install --no-build-isolation --no-cache-dir /tmp/atlas-forge-kickmix
          python -c "import kickmix, numpy; print(kickmix.__file__, numpy.__version__)"

      - name: Build exactly one KMB candidate
        run: |
          mkdir -p dist evidence
          python research/atlas-forge/invsqrt/build_invsqrt.py dist/invsqrt.kmb --format kmb
          sha256sum dist/invsqrt.kmb

      - name: Check reproducible hash and register contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import kickmix as km

          path = Path("dist/invsqrt.kmb")
          expected = "38d90b452ef049e40061bfe5f3601385b1993b3bddb39cc3a0eab92adf62e02b"
          data = path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          circuit = km.Circuit.from_file(str(path), format="kmb")
          stats = circuit.operation_statistics()

          assert digest == expected, f"Expected the source-published circuit hash {expected}, got {digest}"
          assert circuit.num_qubits == 166
          assert stats.num_toffoli_like == 3141
          record = {
              "artifact": "invsqrt.kmb",
              "bytes": len(data),
              "sha256": digest,
              "matches_upstream_full_verifier_candidate": True,
              "num_qubits": circuit.num_qubits,
              "static_toffoli_like_count": stats.num_toffoli_like,
              "operation_count": len(circuit),
              "kickmix_tree": "638777fac4379bc62e2a1e4a52cf1a1753895d48"
          }
          Path("evidence/build-metadata.json").write_text(json.dumps(record, indent=2) + "\\n")
          print(json.dumps(record, indent=2))
          PY

      - name: Fetch pinned competition verifier
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path

          commit = "3dc0c58c5aa303ec8319433aded257aa757d14db"
          expected_blob = "1fa529e9790a5cb000ee7f084e197c9252e5f9d7"
          url = f"https://raw.githubusercontent.com/Inzainos/quantum-circuit-compilation/{commit}/verifiers/invsqrt/verify_submission_invsqrt.py"
          request = urllib.request.Request(url, headers={"User-Agent": "atlas-forge-invsqrt-verifier"})
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          actual_blob = hashlib.sha1(f"blob {len(data)}\\0".encode("ascii") + data).hexdigest()
          if actual_blob != expected_blob:
              raise RuntimeError(f"Verifier source pin mismatch: {actual_blob}")
          Path("/tmp/verify_submission_invsqrt.py").write_bytes(data)
          PY

      - name: Verify all inputs once and a multi-shot prefix
        run: |
          python /tmp/verify_submission_invsqrt.py dist/invsqrt.kmb \\
            --shots-per-x 1 --batch-size 4 --max-workers 2 \\
            --salt atlas-forge-full-domain-one-shot
          python /tmp/verify_submission_invsqrt.py dist/invsqrt.kmb \\
            --shots-per-x 64 --max-x 4096 --batch-size 256 --max-workers 2 \\
            --salt atlas-forge-prefix-64-shot

      - name: Upload exactly one circuit file
        uses: actions/upload-artifact@v4
        with:
          name: atlas-forge-invsqrt-circuit
          path: dist/invsqrt.kmb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-forge-invsqrt-evidence
          path: evidence/build-metadata.json
          if-no-files-found: error
          retention-days: 14
